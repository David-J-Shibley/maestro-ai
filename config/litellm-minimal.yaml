# Minimal LiteLLM config for Maestro AI (copy to your machine and customize).
# Start: litellm --config ~/.maestro-ai/litellm.yaml --port 4000
#
# Required env:
#   FEATHERLESS_API_KEY  — for glm, qwen3-coder-next (Featherless hosted OSS)
#   AWS credentials      — for Bedrock premium tier (optional)

model_list:
  - model_name: qwen3-coder-next
    litellm_params:
      model: openai/Qwen/Qwen3-Coder-Next
      api_base: https://api.featherless.ai/v1
      api_key: os.environ/FEATHERLESS_API_KEY
      use_chat_completions_api: true
      drop_params: true

  - model_name: glm
    litellm_params:
      model: openai/zai-org/GLM-5.2
      api_base: https://api.featherless.ai/v1
      api_key: os.environ/FEATHERLESS_API_KEY
      use_chat_completions_api: true
      drop_params: true

  - model_name: bedrock/global.anthropic.claude-sonnet-4-6
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-6
      aws_region_name: us-east-1
      custom_llm_provider: bedrock

litellm_settings:
  master_key: sk-litellm-local
  drop_params: true
  modify_params: true
